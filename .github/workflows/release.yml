# .github/workflows/release.yml
name: Build and Release ComPet Suite

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow

      # ComPet V3 단독 빌드 (Windows)
      - name: Build ComPet V3 (Windows)
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}/morningmeal_Compet_V3"
          New-Item -ItemType Directory -Force -Path "assets", "skins"
          if (-not (Get-ChildItem -Path "assets")) { New-Item -ItemType File -Force -Path "assets/.keep" }
          if (-not (Get-ChildItem -Path "skins")) { New-Item -ItemType File -Force -Path "skins/.keep" }
          
          $iconArg = @()
          if (Test-Path "assets/app_icon.png") {
              python -c "from PIL import Image; img = Image.open('assets/app_icon.png').convert('RGBA'); img.save('app_icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"
              $iconArg = @("--icon=app_icon.ico")
          }

          pyinstaller --noconfirm --onedir --windowed --name "Compet-V3" `
            --add-data "assets;assets" `
            --add-data "skins;skins" `
            @iconArg `
            main.py
          Compress-Archive -Path dist/Compet-V3 -DestinationPath "${{ github.workspace }}/Compet-V3-Windows.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ./*-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow

      # ComPet V3 단독 빌드 (macOS)
      - name: Build ComPet V3 (macOS)
        run: |
          cd "${{ github.workspace }}/morningmeal_Compet_V3"
          mkdir -p assets skins
          touch assets/.keep skins/.keep
          
          ICON_ARG=""
          if [ -f "assets/app_icon.png" ]; then
            mkdir -p AppIcon.iconset
            sips -z 16 16     assets/app_icon.png --out AppIcon.iconset/icon_16x16.png
            sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_16x16@2x.png
            sips -z 32 32     assets/app_icon.png --out AppIcon.iconset/icon_32x32.png
            sips -z 64 64     assets/app_icon.png --out AppIcon.iconset/icon_32x32@2x.png
            sips -z 128 128   assets/app_icon.png --out AppIcon.iconset/icon_128x128.png
            sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_128x128@2x.png
            sips -z 256 256   assets/app_icon.png --out AppIcon.iconset/icon_256x256.png
            sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_256x256@2x.png
            sips -z 512 512   assets/app_icon.png --out AppIcon.iconset/icon_512x512.png
            sips -z 1024 1024 assets/app_icon.png --out AppIcon.iconset/icon_512x512@2x.png
            iconutil -c icns AppIcon.iconset -o app_icon.icns
            ICON_ARG="--icon=app_icon.icns"
          fi

          pyinstaller --noconfirm --windowed --name "Compet-V3" \
            --add-data "assets:assets" \
            --add-data "skins:skins" \
            $ICON_ARG \
            main.py
          cd dist
          codesign --force --deep --sign - "Compet-V3.app"
          zip -r "${{ github.workspace }}/Compet-V3-macOS.zip" Compet-V3.app

      # ComPet V3 단독 스모크 테스트 (크래시 로그 자동 출력 포함)
      - name: Verify macOS App Bundle
        run: |
          echo "=== 1. Codesign 검증 ==="
          codesign --verify --verbose "${{ github.workspace }}/morningmeal_Compet_V3/dist/Compet-V3.app"

          echo "=== 2. 실행 및 초기화 크래시 검증 (3초 스모크 테스트) ==="
          export QT_QPA_PLATFORM=offscreen

          echo "Testing Compet-V3 executable..."
          "${{ github.workspace }}/morningmeal_Compet_V3/dist/Compet-V3.app/Contents/MacOS/Compet-V3" &
          APP_PID=$!
          sleep 3
          if kill -0 $APP_PID 2>/dev/null; then
            echo "Compet-V3 passed smoke test."
            kill -TERM $APP_PID 2>/dev/null || true
          else
            echo "Error: Compet-V3 crashed on startup!"
            CRASH_LOG="$HOME/Library/Application Support/morningmeal_ComPet/crash_log.txt"
            if [ -f "$CRASH_LOG" ]; then
              echo "=== CRASH LOG CONTENTS ==="
              cat "$CRASH_LOG"
              echo "=========================="
            fi
            wait $APP_PID
            exit 1
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: ./*-macOS.zip

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            windows-binaries/Compet-V3-Windows.zip
            macos-binaries/Compet-V3-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}