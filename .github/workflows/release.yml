# .github/workflows/release.yml
name: Build and Release ComPet Suite

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

# 1. ComPet V3 빌드 (Windows)
      - name: Build ComPet V3 (Windows)
        shell: pwsh
        run: |
          cd morningmeal_Compet_V3
          New-Item -ItemType Directory -Force -Path "assets", "skins"
          if (-not (Get-ChildItem -Path "assets")) { New-Item -ItemType File -Force -Path "assets/.keep" }
          if (-not (Get-ChildItem -Path "skins")) { New-Item -ItemType File -Force -Path "skins/.keep" }
          pyinstaller --noconfirm --onedir --windowed --name "Compet-V3" `
            --add-data "assets;assets" `
            --add-data "skins;skins" `
            main.py
          cd dist
          Compress-Archive -Path Compet-V3 -DestinationPath ../../Compet-V3-Windows.zip

      # 2. KeyPet V2 빌드 (Windows)
      - name: Build KeyPet V2 (Windows)
        shell: pwsh
        run: |
          cd morningmeal_KeyPet_V2
          New-Item -ItemType Directory -Force -Path "assets", "skins"
          if (-not (Get-ChildItem -Path "assets")) { New-Item -ItemType File -Force -Path "assets/.keep" }
          if (-not (Get-ChildItem -Path "skins")) { New-Item -ItemType File -Force -Path "skins/.keep" }
          pyinstaller --noconfirm --onedir --windowed --name "KeyPet-V2" `
            --add-data "assets;assets" `
            --add-data "skins;skins" `
            main.py
          cd dist
          Compress-Archive -Path KeyPet-V2 -DestinationPath ../../KeyPet-V2-Windows.zip

      # 3. WorkTimer V1 빌드 (Windows)
      - name: Build WorkTimer V1 (Windows)
        shell: pwsh
        run: |
          cd morningmeal_WorkTimer_V1
          New-Item -ItemType Directory -Force -Path "assets"
          if (-not (Get-ChildItem -Path "assets")) { New-Item -ItemType File -Force -Path "assets/.keep" }
          pyinstaller --noconfirm --onedir --windowed --name "WorkTimer-V1" `
            --add-data "assets;assets" `
            main.py
          cd dist
          Compress-Archive -Path WorkTimer-V1 -DestinationPath ../../WorkTimer-V1-Windows.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ./*-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. ComPet V3 빌드 (macOS)
# 1. ComPet V3 빌드 (macOS)
      - name: Build ComPet V3 (macOS)
        run: |
          cd morningmeal_Compet_V3
          mkdir -p assets skins
          touch assets/.keep skins/.keep
          pyinstaller --noconfirm --windowed --name "Compet-V3" \
            --add-data "assets:assets" \
            --add-data "skins:skins" \
            main.py
          cd dist
          zip -r ../../Compet-V3-macOS.zip Compet-V3.app
          # Ad-hoc 임시 서명 부여
          codesign --force --deep --sign - "Compet-V3.app"
          zip -r ../../Compet-V3-macOS.zip Compet-V3.app

      # 2. KeyPet V2 빌드 (macOS)
      - name: Build KeyPet V2 (macOS)
        run: |
          cd morningmeal_KeyPet_V2
          mkdir -p assets skins
          touch assets/.keep skins/.keep
          pyinstaller --noconfirm --windowed --name "KeyPet-V2" \
            --add-data "assets:assets" \
            --add-data "skins:skins" \
            main.py
          cd dist
          zip -r ../../KeyPet-V2-macOS.zip KeyPet-V2.app
          # Ad-hoc 임시 서명 부여
          codesign --force --deep --sign - "Compet-V3.app"
          zip -r ../../Compet-V3-macOS.zip Compet-V3.app

      # 3. WorkTimer V1 빌드 (macOS)
      - name: Build WorkTimer V1 (macOS)
        run: |
          cd morningmeal_WorkTimer_V1
          mkdir -p assets
          touch assets/.keep
          pyinstaller --noconfirm --windowed --name "WorkTimer-V1" \
            --add-data "assets:assets" \
            main.py
          cd dist
          zip -r ../../WorkTimer-V1-macOS.zip WorkTimer-V1.app
          # Ad-hoc 임시 서명 부여
          codesign --force --deep --sign - "Compet-V3.app"
          zip -r ../../Compet-V3-macOS.zip Compet-V3.app

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            windows-binaries/*-Windows.zip
            macos-binaries/*-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}