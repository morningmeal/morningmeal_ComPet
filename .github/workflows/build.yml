name: Build and Release Compet Desktop Pet

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Compet-Windows.zip
            run_build: |
              python -m pip install --upgrade pip
              pip install pyinstaller PyQt6 pynput
              pyinstaller --noconfirm --onedir --windowed \
                --add-data "assets;assets" \
                --add-data "skins;skins" \
                --name "Compet" main.py
              # dist 폴더 안으로 이동하여 Compet 폴더 전체를 온전하게 압축
              cd dist
              7z a -tzip ../Compet-Windows.zip Compet
              cd ..

          - os: macos-latest
            artifact_name: Compet-macOS.zip
            run_build: |
              python -m pip install --upgrade pip
              pip install pyinstaller PyQt6 pynput pyobjc-framework-Cocoa
              pyinstaller --noconfirm --windowed \
                --add-data "assets:assets" \
                --add-data "skins:skins" \
                --name "Compet" main.py
              cd dist
              zip -r -y ../Compet-macOS.zip Compet.app
              cd ..

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Executable
        shell: bash
        run: |
          ${{ matrix.run_build }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Compet-Windows.zip/Compet-Windows.zip
            artifacts/Compet-macOS.zip/Compet-macOS.zip
          generate_release_notes: true