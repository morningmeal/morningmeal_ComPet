name: Build and Release Compet Desktop Pet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Compet-Windows.zip
            run_build: |
              python -m pip install --upgrade pip
              pip install pyinstaller PyQt6 pynput Pillow
              
              # icon.png를 Windows용 app.ico로 자동 변환
              python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('app.ico', format='ICO', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])"
              
              pyinstaller --noconfirm --onedir --windowed \
                --icon "app.ico" \
                --add-data "assets;assets" \
                --add-data "skins;skins" \
                --name "Compet" main.py
                
              cd dist
              7z a -tzip ../Compet-Windows.zip Compet
              cd ..

          - os: macos-latest
            artifact_name: Compet-macOS.zip
            run_build: |
              python -m pip install --upgrade pip
              pip install pyinstaller PyQt6 pynput pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices Pillow
              
              # icon.png를 macOS용 icon.icns로 자동 변환
              mkdir -p icon.iconset
              sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
              sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
              sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
              sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
              sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
              sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
              sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
              sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
              sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
              sips -z 1024 1024 assets/icon.png --out icon.iconset/icon_512x512@2x.png
              iconutil -c icns icon.iconset -o app.icns
              
              pyinstaller --noconfirm --windowed \
                --icon "app.icns" \
                --osx-bundle-identifier "com.morningmeal.compet" \
                --add-data "assets:assets" \
                --add-data "skins:skins" \
                --name "Compet" main.py
                
              /usr/libexec/PlistBuddy -c "Add :NSAppleEventsUsageDescription string 'Compet needs access to detect keystrokes for pet animations.'" dist/Compet.app/Contents/Info.plist || true
              /usr/libexec/PlistBuddy -c "Add :NSSystemAdministrationUsageDescription string 'Compet needs accessibility access for global key input listener.'" dist/Compet.app/Contents/Info.plist || true

              cd dist
              zip -r -y ../Compet-macOS.zip Compet.app
              cd ..

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Executable
        shell: bash
        run: |
          ${{ matrix.run_build }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Compet-Windows.zip/Compet-Windows.zip
            artifacts/Compet-macOS.zip/Compet-macOS.zip
          generate_release_notes: true